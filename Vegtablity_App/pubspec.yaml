name: vegtablity_app
description: POS system for Vegtablity.
publish_to: 'none'
version: 2.2.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  responsive_builder: ^0.7.0
  mobile_scanner: ^3.5.5
  url_launcher: ^6.2.5
  sunmi_printer_plus: 4.1.1
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  package_info_plus: ^8.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "lettuce.png"
    icon_size: 256
  image_path: "lettuce.png"

flutter:
  uses-material-design: true
